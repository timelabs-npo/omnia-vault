name: Release Omnia-Vault

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish (macOS)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add secrets for Developer ID signing + notarization:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Omnia-Vault v__VERSION__'
          releaseBody: |
            ## Omnia-Vault v__VERSION__ — SCION Mesh Control Pane

            ### What's New
            - **Dual-Valve architecture**: independent Cold (mio) and Hot (wd) valves; blended multi-path when both open — no artificial "warm toggle"
            - **Real Mole telemetry**: live Darwin sysinfo (CPU, RAM, disk, top processes) via native Rust sysinfo crate
            - **Native macOS menu bar**: live ticker, valve toggles, wipe caches — always accessible
            - **Remote WSL2 control** via SSH BatchMode (zero cloud, zero agents)
            - **SCION managed daemons**: CS, BR1/BR2, godispatcher, sciond, SIG with real ports and path routing matrix
            - **GNS3 topology**: QEMU/Docker node control from the tray
            - **LIT-001 CAS**: 243-byte canonical publication receipts in SQLite WAL
            - **Rheknel zero-trust gate**: fails closed on destructive mutations
            - **Local LLM gateway**: Ollama/MLX (Llama-3, Qwen2.5-Coder) — no OpenAI tokens required
            - **Removed**: `omnia-portal` web bloat, Electron, proprietary cloud middleware

            ### 🍨 Fuel For Engineer (Pistachio Gelato Manifesto)
            > *"Свойство `имеетМороженое` у нашего разработчика строго должно быть равно `True`, иначе система упадет от нехватки глюкозы."*
            
            Мы экономим вам миллионы долларов на AWS. Угостите главного инженера ведерком фисташкового джелато (**pistachio gelato**) на [GitHub Sponsors](https://github.com/sponsors/timelabs-npo)! 🍨🍦

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS Apple Silicon | `Omnia-Vault_aarch64.dmg` |
            | macOS Intel | `Omnia-Vault_x64.dmg` |
            | Windows x64 | `Omnia-Vault_x64-setup.exe` |

            ### Requirements
            - macOS 13+ (Ventura) or Windows 11
            - For SCION mesh control: running `sciond` and `godispatcher` on target hosts
            - For remote WSL2 control: SSH access to Windows host (BatchMode=yes)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and publish (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Omnia-Vault v__VERSION__'
          releaseBody: 'See macOS build for full release notes.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
