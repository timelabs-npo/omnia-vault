<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Omnia Vault — the cave remembers</title><desc id="d">A bright archaeological section drawing of a Cretan cave transformed into an immutable content-addressed causal graph.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e8"/><stop offset=".52" stop-color="#f9fff8"/><stop offset="1" stop-color="#bdeef0"/></linearGradient><linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ea6b4d"/><stop offset="1" stop-color="#5a2748"/></linearGradient></defs><rect width="1600" height="760" rx="42" fill="url(#bg)"/><path d="M865 96c160-80 466-33 622 113v458H756c34-61 69-117 83-188 18-92-30-158 26-383Z" fill="url(#rock)" opacity=".96"/><path d="M958 181c121-39 302 4 413 100 58 51 85 116 72 189-16 89-85 126-170 139-100 15-237 5-319-64-107-90-109-279 4-364Z" fill="#0d2638"/><g stroke="#ffe773" stroke-width="6" fill="#d8ffff"><circle cx="1016" cy="333" r="24"/><circle cx="1141" cy="251" r="24"/><circle cx="1232" cy="365" r="24"/><circle cx="1344" cy="288" r="24"/><circle cx="1325" cy="494" r="24"/><path d="M1038 318l80-52m45 2 46 73m46 9 66-44m-75 82 55 82M1040 347l263 132"/></g><path d="M846 602c164 16 422 9 613-27" stroke="#24d3c7" stroke-width="13" fill="none"/><circle cx="1435" cy="577" r="22" fill="#ffe773" stroke="#0d2638" stroke-width="5"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#0d2638"><text x="78" y="112" font-size="34" font-weight="800" letter-spacing="5">OMNIA VAULT</text><text x="78" y="216" font-size="94" font-weight="950">THE CAVE</text><text x="78" y="307" font-size="94" font-weight="950">REMEMBERS.</text><text x="82" y="387" font-size="28" font-weight="750">Immutable-first storage for state that must survive weather, agents, crashes and disconnection.</text><text x="82" y="451" font-size="22">content address → causal ancestry → conditional head → verified projection</text><text x="82" y="532" font-size="20" font-weight="800" fill="#c73f3f">CURRENT CHECKOUT ≠ FINISHED SYNC ENGINE.</text><text x="82" y="570" font-size="20">Prototype data paths exist; the causal/atomic contract is the target and must be proven.</text></g><g font-family="ui-monospace,monospace" fill="#fff" font-size="16"><text x="938" y="130">CRETE / STATE STRATA</text><text x="980" y="648">HEAD → only after validation</text></g></svg>