[package]
name = "supervisor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
sysinfo = "0.30"
sha2 = "0.11.0"
uuid = { version = "1.26.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
